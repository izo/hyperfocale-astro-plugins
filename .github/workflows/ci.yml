name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # E2e hebdomadaire (#158, CODE-009) : les tests e2e lancent un vrai build Astro et
  # sont trop lents pour chaque PR ; ils attrapent une dérive d'Astro ou d'une
  # dépendance. Lancement manuel possible depuis l'onglet Actions.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` exécute aussi le hook `prepare` → `npm run build` (valide build + DTS).
      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      # Rapport de couverture des tests unitaires — sans seuil : il mesure, il ne bloque pas.
      - name: Couverture
        run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:e2e
