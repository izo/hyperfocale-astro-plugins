name: Publish

# Publie @regrets/hyperfocale sur le registre npm public.
#
# Deux déclencheurs :
#   - un tag `v*` poussé sur le dépôt (chemin nominal) ;
#   - un lancement manuel depuis l'onglet Actions (rattrapage).
#
# Un secret `NPM_TOKEN` est requis (jeton npm « Automation »). En échange,
# les CONSOMMATEURS n'ont plus rien à présenter : GitHub Packages exigeait
# une authentification même pour un paquet public, ce qui imposait un jeton
# en local, en CI et au déploiement de chaque site installant le plugin.
#
# `publishConfig.access: public` est indispensable : un paquet scopé (@izo/…)
# serait sinon publié « restricted », donc inaccessible.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # `npm ci` exécute le hook `prepare` → `npm run build` (dist/ + DTS).
      - run: npm ci

      # `npm publish` exécute `prepublishOnly` → typecheck + tests unitaires.
      # Rien n'est publié si l'un des deux échoue.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
