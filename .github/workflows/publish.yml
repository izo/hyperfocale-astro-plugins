name: Publish

# Publie @regrets/hyperfocale sur le registre npm public.
#
# Deux déclencheurs :
#   - un tag `v*` poussé sur le dépôt (chemin nominal) ;
#   - un lancement manuel depuis l'onglet Actions (rattrapage) — uniquement
#     depuis un tag, jamais depuis une branche.
#
# Deux jobs, pour que le code des devDependencies (tsc, vitest, esbuild…) ne
# tourne jamais là où se trouve le moyen de publier (#154) :
#   - `verify` : build, typecheck, tests, empaquetage. Ni secret, ni jeton OIDC.
#   - `publish` : ne récupère que le tarball de `verify` et le publie. Aucun
#     checkout, aucun `npm ci`, aucun script de cycle de vie.
#
# Publication de confiance npm (OIDC) : `id-token: write` + `--provenance`.
# Tant que le paquet n'a pas de « Trusted Publisher » configuré sur npmjs.com,
# le secret `NPM_TOKEN` (jeton « Automation ») reste le repli ; une fois la
# publication de confiance en place, supprimer ce secret.
#
# Les actions sont épinglées par SHA (le commentaire donne l'étiquette lue) ;
# Renovate les tient à jour.
#
# `publishConfig.access: public` est indispensable : un paquet scopé serait
# sinon publié « restricted », donc inaccessible.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuser un lancement hors tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Publier depuis un tag vX.Y.Z, pas depuis la branche ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Le tag doit égaler la version de package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à package.json (v${version})."
            exit 1
          fi

      # `npm ci` exécute le hook `prepare` → `npm run build` (dist/ + DTS).
      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      - name: Empaqueter
        run: npm pack --pack-destination "${RUNNER_TEMP}/pkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package
          path: pkg

      # Un tarball : `prepublishOnly` ne s'exécute pas, il a déjà tourné dans `verify`.
      - run: npm publish ./pkg/*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
